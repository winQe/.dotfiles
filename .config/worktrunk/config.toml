# Worktrunk User Configuration

# Only commit staged files, don't auto-stage
[commit]
stage = "none"

# LLM commit message generation via Claude
[commit.generation]
command = "CLAUDECODE= MAX_THINKING_TOKENS=0 claude -p --model=haiku --tools='' --disable-slash-commands --setting-sources='' --system-prompt=''"

template = """
Write a commit message for the staged changes below.

<format>
Analyze these git staged changes and write a single line conventional commit message following this developer's style:

<type>: <description>

Style patterns from previous commits:
- feat: implement new feature
- fix: fix lint errors on App
- test: update tests for navigating routes
- track: add tracking events for Open in App
- refactor: reindent code
- chore: bump node.js
- feat: update localization for pasting elements

Guidelines:
- types are limited to fix, feat, chore, test, refactor, track
- Use lowercase after the colon
- Be concise but descriptive
- Focus on what the change does, not how
- Use present tense (add, fix, update, etc.)
- Keep under 72 characters when possible

Staged changes:
```
{staged_diff}
```

Current branch: {branch_name}
Use the branch name context to better understand what feature/fix is being worked on.

Generate just the commit message, nothing else.
</format>

<diffstat>
{{ git_diff_stat }}
</diffstat>

<diff>
{{ git_diff }}
</diff>

<context>
Branch: {{ branch }}
{% if recent_commits %}<recent_commits>
{% for commit in recent_commits %}- {{ commit }}
{% endfor %}</recent_commits>{% endif %}
</context>

"""

squash-template = """
Combine these commits into a single commit message.

<format>
- Use conventional commits format: type: description
- Valid types: fix, feat, chore, refactor, perf, test, docs, ci
- Subject line under 50 chars, lowercase, imperative mood
- Subject line ONLY, no body paragraph
- Output only the commit message, no quotes or code blocks
</format>

<commits branch="{{ branch }}" target="{{ target_branch }}">
{% for commit in commits %}- {{ commit }}
{% endfor %}</commits>

<diffstat>
{{ git_diff_stat }}
</diffstat>

<diff>
{{ git_diff }}
</diff>

"""
